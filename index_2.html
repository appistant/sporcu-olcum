<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sporcu Ölçüm — Prototip v4 (Dokunmadan Otomatik)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b0f14;color:#e8eef5;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
  video{display:none}
  canvas{max-width:100%;max-height:100%}
  .panel{position:fixed;top:0;left:0;right:0;padding:10px 12px;background:linear-gradient(#000c,#0000);display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
  .btn{background:#1f6feb;color:#fff;border:none;border-radius:12px;padding:11px 15px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.secondary{background:#30363d}
  label{font-size:13px;opacity:.9}
  input[type=number]{width:70px;padding:8px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#fff;font-size:15px}
  #status{font-size:13px;opacity:.9;flex-basis:100%;margin-top:4px}
  #scaleInfo{position:fixed;top:58px;left:12px;z-index:6;font-size:13px;font-weight:700;color:#39FF14;text-shadow:0 1px 4px #000}
  .result{position:fixed;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(#0000,#000d);z-index:5;text-align:center}
  .big{font-size:46px;font-weight:800;line-height:1.05;margin:4px 0;color:#FFD400}
  .label{opacity:.9;font-size:14px}
  .hint{opacity:.75;font-size:12px;margin-top:4px}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div class="panel">
  <button class="btn" id="startBtn">Kamerayı Başlat</button>
  <button class="btn secondary" id="switchBtn">Kamera Çevir</button>
  <label>QR gerçek boyutu (cm): <input type="number" id="qrSize" value="3.0" step="0.1" min="0.5"></label>
  <div id="status">Yükleniyor…</div>
</div>
<div id="scaleInfo">Ölçek: —</div>

<div class="result">
  <div class="label">Omuz genişliği — <b>otomatik, hiç dokunmadan</b></div>
  <div class="big" id="resVal">—</div>
  <div class="hint" id="hint">QR'ı göğsüne yakın tut, üst vücudun kadrajda olsun.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">
import {PoseLandmarker, FilesetResolver, DrawingUtils}
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const statusEl=document.getElementById('status');
const scaleInfo=document.getElementById('scaleInfo');
const resVal=document.getElementById('resVal');
const hint=document.getElementById('hint');
const qrSizeInp=document.getElementById('qrSize');

let poseLandmarker=null, running=false, facing='user', stream=null, drawUtils=null;
let cmPerPx=null, lastQRtime=0;
const recent=[]; // yumuşatma için son ölçümler

async function makeLandmarker(vision,delegate){
  return await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate},
    runningMode:"VIDEO", numPoses:1 });
}
async function init(){
  try{
    statusEl.textContent='Model yükleniyor…';
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    try{ poseLandmarker=await makeLandmarker(vision,"GPU"); }catch(e){ poseLandmarker=await makeLandmarker(vision,"CPU"); }
    statusEl.textContent='Hazır. “Kamerayı Başlat”a bas.';
  }catch(err){ statusEl.textContent='Model yüklenemedi (internet gerekli): '+err.message; }
}
init();

async function startCam(){
  if(!poseLandmarker){ statusEl.textContent='Model henüz hazır değil, bekle.'; return; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false}); }
  catch(e){ statusEl.textContent='Kamera açılamadı: '+e.message; return; }
  video.srcObject=stream; await video.play();
  canvas.width=video.videoWidth||1280; canvas.height=video.videoHeight||720;
  drawUtils=new DrawingUtils(ctx); running=true;
  statusEl.textContent='Çalışıyor — otomatik ölçüyor.';
  loop();
}

function qrSidePx(loc){
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  return (d(loc.topLeftCorner,loc.topRightCorner)+d(loc.topRightCorner,loc.bottomRightCorner)
        +d(loc.bottomRightCorner,loc.bottomLeftCorner)+d(loc.bottomLeftCorner,loc.topLeftCorner))/4;
}

let qc=0, lastVideoTime=-1;
function loop(){
  if(!running) return;
  if(video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    // QR ölçek (her 3. kare)
    qc++;
    if(window.jsQR && qc%3===0){
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(img.data,canvas.width,canvas.height,{inversionAttempts:"dontInvert"});
      if(code && code.data){
        const side=qrSidePx(code.location);
        const realCm=parseFloat(qrSizeInp.value)||3.0;
        cmPerPx=realCm/side; lastQRtime=performance.now();
        const l=code.location;
        ctx.strokeStyle='#39FF14'; ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(l.topLeftCorner.x,l.topLeftCorner.y);
        ctx.lineTo(l.topRightCorner.x,l.topRightCorner.y);
        ctx.lineTo(l.bottomRightCorner.x,l.bottomRightCorner.y);
        ctx.lineTo(l.bottomLeftCorner.x,l.bottomLeftCorner.y);
        ctx.closePath(); ctx.stroke();
      }
    }
    const qrOK = cmPerPx && (performance.now()-lastQRtime<800);
    scaleInfo.textContent = qrOK ? ('Ölçek ✓  (1 cm ≈ '+(1/cmPerPx).toFixed(1)+' px)') : 'Ölçek: — (QR’ı göster)';

    // poz → omuzları OTOMATİK bul (11 sol, 12 sağ)
    let res=null;
    try{ res=poseLandmarker.detectForVideo(video, performance.now()); }catch(e){}
    if(res && res.landmarks && res.landmarks.length){
      const lm=res.landmarks[0];
      drawUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, {color:'#00E5FF', lineWidth:2});
      const Ls=lm[11], Rs=lm[12];
      if(Ls && Rs){
        const x1=Ls.x*canvas.width, y1=Ls.y*canvas.height;
        const x2=Rs.x*canvas.width, y2=Rs.y*canvas.height;
        // omuz çizgisini vurgula
        ctx.strokeStyle='#FF3B30'; ctx.lineWidth=5;
        ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.fillStyle='#FF3B30';
        [[x1,y1],[x2,y2]].forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill(); });
        if(qrOK){
          const px=Math.hypot(x1-x2,y1-y2);
          const cm=px*cmPerPx;
          if(cm>10 && cm<80){
            recent.push(cm); if(recent.length>12) recent.shift();
            const avg=recent.reduce((a,b)=>a+b,0)/recent.length;
            resVal.textContent=avg.toFixed(1)+' cm';
            hint.textContent='Sistem omuzları kendi buldu — sen hiçbir yere dokunmadın ✓';
          }
        } else {
          hint.textContent='Ölçek yok — QR’ı da kadrajda, göğsüne yakın tut.';
        }
      }
    } else {
      hint.textContent='Vücut görünmüyor — biraz geri çekil, üst gövden kadrajda olsun.';
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick=startCam;
document.getElementById('switchBtn').onclick=()=>{ facing=(facing==='user')?'environment':'user'; if(running) startCam(); };
</script>
</body>
</html>
