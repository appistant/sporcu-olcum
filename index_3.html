<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sporcu Ölçüm</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b0f14;color:#e8eef5;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
  video{display:none}
  canvas{max-width:100%;max-height:100%}
  .top{position:fixed;top:0;left:0;right:0;padding:8px 10px;background:linear-gradient(#000d,#0000);z-index:6;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .btn{background:#1f6feb;color:#fff;border:none;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer}
  .btn:active{transform:scale(.97)}
  .btn.secondary{background:#30363d}
  label{font-size:12px;opacity:.9}
  input[type=number]{width:60px;padding:7px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#fff;font-size:15px}
  .pills{position:fixed;top:54px;left:0;right:0;z-index:6;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px}
  .pill{padding:8px 14px;border-radius:999px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;border:2px solid #333;background:#161b22cc;color:#8b97a5}
  .pill.on{background:#0f3d1eee;border-color:#2ea043;color:#4ade80}
  .banner{position:fixed;left:0;right:0;bottom:118px;z-index:6;text-align:center;pointer-events:none}
  .banner .box{display:inline-block;padding:12px 22px;border-radius:16px;font-size:24px;font-weight:900;box-shadow:0 4px 20px #0008}
  .box.ready{background:#2ea043;color:#fff}
  .box.wait{background:#f0b429;color:#111;font-size:18px}
  .result{position:fixed;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(#0000,#000e);z-index:5;text-align:center}
  .rlabel{opacity:.9;font-size:14px}
  .big{font-size:44px;font-weight:900;line-height:1.05;margin:2px 0;color:#FFD400}
  #status{font-size:12px;opacity:.85;flex-basis:100%;margin-top:2px}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>

<div class="top">
  <button class="btn" id="startBtn">Başlat</button>
  <button class="btn secondary" id="switchBtn">Kamera Çevir</button>
  <label>Kart cm: <input type="number" id="qrSize" value="12" step="0.1" min="0.5"></label>
  <div id="status">Yükleniyor…</div>
</div>

<div class="pills">
  <div class="pill" id="pillId">⬜ Kartı göster</div>
  <div class="pill" id="pillBody">⬜ Vücut kadrajda değil</div>
</div>

<div class="banner"><div class="box wait" id="bannerBox">Başlat’a bas</div></div>

<div class="result">
  <div class="rlabel">Omuz genişliği (otomatik, dokunmadan)</div>
  <div class="big" id="resVal">—</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">
import {PoseLandmarker, FilesetResolver, DrawingUtils}
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const statusEl=document.getElementById('status');
const resVal=document.getElementById('resVal');
const qrSizeInp=document.getElementById('qrSize');
const pillId=document.getElementById('pillId');
const pillBody=document.getElementById('pillBody');
const bannerBox=document.getElementById('bannerBox');

let poseLandmarker=null, running=false, facing='user', stream=null, drawUtils=null;
let cmPerPx=null, lastQRtime=0, qrID=null, qrIDtime=0;
const recent=[];

async function makeLandmarker(vision,delegate){
  return await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate},
    runningMode:"VIDEO", numPoses:1 });
}
async function init(){
  try{
    statusEl.textContent='Model yükleniyor…';
    const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    try{ poseLandmarker=await makeLandmarker(vision,"GPU"); }catch(e){ poseLandmarker=await makeLandmarker(vision,"CPU"); }
    statusEl.textContent='Hazır. “Başlat”a bas.';
  }catch(err){ statusEl.textContent='Model yüklenemedi (internet gerekli): '+err.message; }
}
init();

async function startCam(){
  if(!poseLandmarker){ statusEl.textContent='Model henüz hazır değil, bekle.'; return; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false}); }
  catch(e){ statusEl.textContent='Kamera açılamadı: '+e.message; return; }
  video.srcObject=stream; await video.play();
  canvas.width=video.videoWidth||1280; canvas.height=video.videoHeight||720;
  drawUtils=new DrawingUtils(ctx); running=true;
  statusEl.textContent='Çalışıyor.';
  loop();
}

function qrSidePx(loc){
  const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  return (d(loc.topLeftCorner,loc.topRightCorner)+d(loc.topRightCorner,loc.bottomRightCorner)
        +d(loc.bottomRightCorner,loc.bottomLeftCorner)+d(loc.bottomLeftCorner,loc.topLeftCorner))/4;
}

function setPill(el,on,text){ el.textContent=(on?'✅ ':'⬜ ')+text; el.classList.toggle('on',on); }

let qc=0, lastVideoTime=-1;
function loop(){
  if(!running) return;
  if(video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    // QR (her 3. kare)
    qc++;
    if(window.jsQR && qc%3===0){
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(img.data,canvas.width,canvas.height,{inversionAttempts:"dontInvert"});
      if(code && code.data){
        const side=qrSidePx(code.location);
        const realCm=parseFloat(qrSizeInp.value)||12;
        cmPerPx=realCm/side; lastQRtime=performance.now();
        qrID=code.data; qrIDtime=performance.now();
        const l=code.location;
        ctx.strokeStyle='#39FF14'; ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(l.topLeftCorner.x,l.topLeftCorner.y);
        ctx.lineTo(l.topRightCorner.x,l.topRightCorner.y);
        ctx.lineTo(l.bottomRightCorner.x,l.bottomRightCorner.y);
        ctx.lineTo(l.bottomLeftCorner.x,l.bottomLeftCorner.y);
        ctx.closePath(); ctx.stroke();
      }
    }
    const now=performance.now();
    const qrOK = cmPerPx && (now-lastQRtime<900);
    const idOK = qrID && (now-qrIDtime<900);

    // poz
    let res=null, bodyOK=false, shoulderCm=null;
    try{ res=poseLandmarker.detectForVideo(video, now); }catch(e){}
    if(res && res.landmarks && res.landmarks.length){
      const lm=res.landmarks[0];
      const Ls=lm[11], Rs=lm[12];
      if(Ls && Rs && (Ls.visibility===undefined || Ls.visibility>0.5) && (Rs.visibility===undefined || Rs.visibility>0.5)){
        bodyOK=true;
        drawUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, {color:'#00E5FF', lineWidth:2});
        const x1=Ls.x*canvas.width, y1=Ls.y*canvas.height, x2=Rs.x*canvas.width, y2=Rs.y*canvas.height;
        ctx.strokeStyle='#FF3B30'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
        ctx.fillStyle='#FF3B30'; [[x1,y1],[x2,y2]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();});
        if(qrOK){ const px=Math.hypot(x1-x2,y1-y2); const cm=px*cmPerPx; if(cm>10&&cm<80) shoulderCm=cm; }
      }
    }

    // göstergeler
    setPill(pillId, idOK, idOK ? ('Sporcu: '+qrID) : 'Kartı göster');
    setPill(pillBody, bodyOK, bodyOK ? 'Vücut görüldü' : 'Vücut kadrajda değil');

    // banner
    const ready = qrOK && bodyOK;
    if(ready){
      bannerBox.className='box ready'; bannerBox.textContent='✅ ÖLÇÜME HAZIR';
    } else {
      bannerBox.className='box wait';
      if(!qrOK && !bodyOK) bannerBox.textContent='Kartı göster + kadraja gir';
      else if(!qrOK) bannerBox.textContent='İşaretçi kartını göster';
      else bannerBox.textContent='Geri çekil — omuzların görünsün';
    }

    // sonuç
    if(ready && shoulderCm!=null){
      recent.push(shoulderCm); if(recent.length>12) recent.shift();
      const avg=recent.reduce((a,b)=>a+b,0)/recent.length;
      resVal.textContent=avg.toFixed(1)+' cm';
    } else if(!ready){
      resVal.textContent='—';
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').onclick=startCam;
document.getElementById('switchBtn').onclick=()=>{ facing=(facing==='user')?'environment':'user'; if(running) startCam(); };
</script>
</body>
</html>
